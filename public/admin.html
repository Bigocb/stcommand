<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Standing Orders — Admin</title>
<style>
  :root {
    --ink: #0c0e14; --panel: #12151d; --hairline: #232838;
    --bone: #e7e4da; --dim: #7c8291; --accent: #6c9dff;
    --red: #e5697b; --green: #7fd8a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ink); color: var(--bone);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 24px;
  }
  h1 { font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 20px; color: var(--dim); }
  h1 b { color: var(--bone); }
  .card {
    max-width: 720px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--hairline); border-radius: 8px; padding: 20px;
  }
  .unlock { display: flex; gap: 8px; }
  input[type="password"] {
    flex: 1; background: var(--ink); border: 1px solid var(--hairline); color: var(--bone);
    padding: 9px 10px; border-radius: 5px; font: inherit;
  }
  button {
    background: var(--accent); color: #0c0e14; border: none; border-radius: 5px;
    padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.danger { background: var(--red); }
  button:disabled { opacity: 0.5; cursor: default; }
  .err { color: var(--red); margin-top: 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--hairline); font-size: 12px; }
  th { color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 99px; font-size: 10px; letter-spacing: 0.04em; }
  .badge.run { background: rgba(127,216,160,.15); color: var(--green); }
  .badge.stop { background: rgba(124,130,145,.15); color: var(--dim); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .toolbar span { color: var(--dim); font-size: 12px; }
  .empty { color: var(--dim); padding: 20px 0; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Standing Orders <b>Admin</b></h1>
<div class="card">
  <div class="unlock" id="unlock-panel">
    <input type="password" id="key-input" placeholder="Admin key" autocomplete="off" />
    <button id="unlock-btn">Unlock</button>
  </div>
  <div class="err" id="err" hidden></div>

  <div id="tenants-panel" hidden>
    <div class="toolbar">
      <span id="count">—</span>
      <button id="refresh-btn">Refresh</button>
    </div>
    <table id="tenants-table">
      <thead>
        <tr><th>Agent</th><th>Created</th><th>Last seen</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="tenants-body"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No tenants.</div>
  </div>
</div>
<script type="module" src="/admin.js"></script>
</body>
</html>
